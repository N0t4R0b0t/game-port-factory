id = "c64"
name = "Commodore 64"
year = 1982
memory_kb = 64

[axes]
cpu = "6502"
raster = "lores-8bit"
color = "palette16-cell4"
audio = "sid"
storage = "disk"

# VIC-II geometry. Multicolour sprites are 12 pixels wide, each drawn double
# width — they occupy the same 24 screen pixels as a hires sprite.
[video]
screen_pixels = [320, 200]
screen_chars = [40, 25]
char_cell = [8, 8]
sprite_hires = [24, 21]
sprite_multicolor = [12, 21]

# Pepto PAL. The VIC-II has no RGB output at all; these are the standard
# measured PAL chroma/luma conversions and are what VICE renders by default,
# so a sprite quantised to them matches what the emulator screenshots.
# Index is the VIC-II colour number, so this doubles as the register table.
[palette]
names = [
  "black", "white", "red", "cyan", "purple", "green", "blue", "yellow",
  "orange", "brown", "light-red", "dark-grey", "grey", "light-green",
  "light-blue", "light-grey",
]
rgb = [
  "#000000", "#FFFFFF", "#68372B", "#70A4B2", "#6F3D86", "#588D43", "#352879", "#B8C76F",
  "#6F4F25", "#433900", "#9A6759", "#444444", "#6C6C6C", "#9AD284", "#6C5EB5", "#959595",
]
