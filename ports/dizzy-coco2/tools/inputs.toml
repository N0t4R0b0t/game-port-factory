required = "yes"
use      = "roomdata --names (room names)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, info/rooms"

[[input]]
id       = "title-png"
group    = "d3"
path     = "info/dizzy3_title.png"
dest     = "research/D3-prior-art/info/dizzy3_title.png"
sha256   = "c9e39e76cc6f023a94905f3e552b01cce2673a8c09d08bfb9bfefbb9e21c1a27"
required = "yes"
use      = "tools/title_image.py (title screen)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, info/dizzy3_title.png"

# ---- run-only (group rom) ---------------------------------------------------------------------
# Needed to RUN the result in an emulator, never to build it. Checked only when --roms is given
# (sha256 as recorded in NOTES.md:366-368; files named BASIC.ROM, EXTBASIC.ROM, DSKBASIC.ROM).

[[input]]
id       = "rom-basic"
group    = "rom"
path     = "BASIC.ROM"
dest     = "source/roms/BASIC.ROM"
sha256   = "40413d0f8bc1bb345ffe49404b3bf645a5417b02f32266536f6566dbf9ca70fb"
required = "run-only"
use      = "play.sh / XRoar / MAME coco2b"
get      = "https://colorcomputerarchive.com/repo/ROMs/David%20Keil/coco-2/ (Color BASIC 1.2 as BASIC.ROM)"

[[input]]
id       = "rom-extbasic"
group    = "rom"
path     = "EXTBASIC.ROM"
dest     = "source/roms/EXTBASIC.ROM"
sha256   = "a18f270d3495d82b9f515de049f46253a623a2d9b1bb226c9ad338508344c5ee"
required = "run-only"
use      = "play.sh / XRoar / MAME coco2b"
get      = "https://colorcomputerarchive.com/repo/ROMs/David%20Keil/coco-2/ (Extended Color BASIC 1.1 as EXTBASIC.ROM)"

[[input]]
id       = "rom-dskbasic"
group    = "rom"
path     = "DSKBASIC.ROM"
dest     = "source/roms/DSKBASIC.ROM"
sha256   = "1c40c5a74e72edaeecc2511fee1aab347eae2c3d5fc6778cb622e3df14d63157"
required = "run-only"
use      = "play.sh --floppy (Disk BASIC 1.1)"
get      = "https://colorcomputerarchive.com/repo/ROMs/David%20Keil/coco-2/ (Disk Extended Color BASIC 1.1 as DSKBASIC.ROM)"

# ---- harness-only, optional (group harness) ---------------------------------------------------
