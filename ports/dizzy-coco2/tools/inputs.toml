# Every file you must supply to build the Dizzy CoCo2 port. NOTHING here is in the repo and
# nothing is ever downloaded for you: tools/bootstrap.sh only verifies these by sha256 and copies
# them to where the tools expect them (all destinations are gitignored).
#
# Read by tools/bootstrap.sh with a deliberately dumb parser: keep one `key = "value"` per line
# and the [[input]] tables flat. Paths are relative to the group root given below.
#
# group "d3"      root = the picosonic/D3 checkout (bootstrap --d3 DIR); required to BUILD
# group "rom"     root = a dir holding the Tandy CoCo ROMs (bootstrap --roms DIR); RUN-ONLY, not needed to build
# group "harness" located in place under source/; only the original-vs-port harnesses use them; optional

[upstream]
repo   = "picosonic/D3"
url    = "https://github.com/picosonic/D3"
commit = "4ac31df"
date   = "2026-04-17"
note   = "MIT-licensed redistribution of the Oliver Twins' released Fantasy World Dizzy source and data (NOTES.md:155). The sha256 sums below were taken from the local copy of that checkout."

# ---- required to build (group d3) -------------------------------------------------------------

[[input]]
id       = "x-all"
group    = "d3"
path     = "original_source/X-ALL.TXT"
dest     = "research/D3-prior-art/original_source/X-ALL.TXT"
sha256   = "63763cd3dec3716f52a404d5dad9e3a9e89a8e35adaf362b9c380ab2d29e768d"
required = "yes"
use      = "actordata (actors.json); source of the game text"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/X-ALL.TXT"

[[input]]
id       = "frames"
group    = "d3"
path     = "original_source/FRAMES.DAT"
dest     = "research/D3-prior-art/original_source/FRAMES.DAT"
sha256   = "dc9a3e7667b8b83012f73acd169339761f14fcd807afc3256265a90306838701"
required = "yes"
use      = "spritedata frmtable, roompack (all room and scenery art)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/FRAMES.DAT"

[[input]]
id       = "roomdata"
group    = "d3"
path     = "original_source/ROOMDATA.DAT"
dest     = "research/D3-prior-art/original_source/ROOMDATA.DAT"
sha256   = "2c5b0b5f3788065607df5ab31c63d80f87b0634cdfb3f602b9ccb899b649b6ec"
required = "yes"
use      = "roomdata (rooms.json)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/ROOMDATA.DAT"

[[input]]
id       = "dizzyfrm"
group    = "d3"
path     = "original_source/DIZZYFRM.DAT"
dest     = "research/D3-prior-art/original_source/DIZZYFRM.DAT"
sha256   = "9e957dabc92ebe909900c1ae5626877628317f3379c197b2770b07cc273f06be"
required = "yes"
use      = "spritedata dizzy-pack-all (Dizzy's 39 animation frames)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/DIZZYFRM.DAT"

[[input]]
id       = "music128"
group    = "d3"
path     = "original_source/MUSIC128.SPC"
dest     = "research/D3-prior-art/original_source/MUSIC128.SPC"
sha256   = "5b237d50a6705418ceb9399d6e56c16ebfd20ec9f96f13a5620a87b2b5d03f8c"
required = "yes"
use      = "tools/mksounds.sh (aycapture: tunes and sound effects)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/MUSIC128.SPC"

[[input]]
id       = "music48"
group    = "d3"
path     = "original_source/MUSIC48.SPC"
dest     = "research/D3-prior-art/original_source/MUSIC48.SPC"
sha256   = "9fbb6d1949f775681701f56bcd495fb647d1c8d6b8767af29b56934839be39aa"
required = "yes"
use      = "tools/mksounds.sh (beepcapture; alternative title tune capture)"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/MUSIC48.SPC"

[[input]]
id       = "prtdizzy"
group    = "d3"
path     = "original_source/PRTDIZZY.PDS"
dest     = "research/D3-prior-art/original_source/PRTDIZZY.PDS"
sha256   = "ca47fc88c0a5a315ae9d7807796a63c39516e94ed3d1cd1ec5dd42aa8c18211b"
required = "yes"
use      = "game text and tables (textdata); kept in the pin so the whole source set is verified"
get      = "https://github.com/picosonic/D3 @ 4ac31df, original_source/PRTDIZZY.PDS"

[[input]]
id       = "rooms-info"
group    = "d3"
path     = "info/rooms"
dest     = "research/D3-prior-art/info/rooms"
