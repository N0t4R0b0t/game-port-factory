# roomcmp expectations: every EXPECTED deviation names its reason (gpfdiff's rule: a deviation is never silent).
# A reason that starts with DECISION is a finding the coordinator has to rule on (docs/ROOM-FIDELITY.md, "For decision"):
# it is listed here so the run is quiet, not because it is accepted.
#
# [[expect]]
# room = 36            # the room under test
# entity = "z44"       # the ZX movingdata index ("z44"), "*" for any entity of the room, or "flames" / "water" (channel "pos" or "ctr")
# channel = "col"      # room | x | y | frame | col | ctr | pos | boxes | dizzy-anim
# verdict = "diverge"  # what the standing-still comparer is expected to say: diverge | phase | sparse (ignored by `visits`)
# mode = "trace"     # optional: "trace" = standing-still traces only, "visits" = passive logs only; default both
# reason = "why this cannot / should not be matched"

[[expect]]
room = 36
entity = "z44"
channel = "x"
verdict = "diverge"
reason = "the original's rat starts at x=96 units (256 px, just off the right edge: resetmoving copies origx) and walks in; a port x is one byte, so the port's rat starts at x=40 px on its patrol. Same patrol 48..192 px, same pace (4 px per 2 ticks) and same leg lengths since T0255; only the start differs, and the random legs differ (two RNGs)."

[[expect]]
room = 36
entity = "z44"
channel = "col"
verdict = "diverge"
reason = "the original mirrors the rat with colour bit 7 (ratnewdir xors it); the port keeps the facing in v1 and draws the mirrored sprite variant: the same picture."

[[expect]]
room = 45
entity = "water"
channel = "pos"
verdict = "diverge"
mode = "trace"
reason = "the original's leftmost water tile sits at x=-16 px (half off the left edge); a port x is one unsigned byte and blit does not clip on the left, so roompack emits it wrapped (240) and the left 16 px strip has no water. A water-list entry (32 px wide, one shared frame set), so even the converter clip of D4 does not reach it; needs a runtime left clip or a per-tile frame set (docs/ROOM-FIDELITY.md E3, NOTES T0261)."

[[expect]]
room = 46
entity = "water"
channel = "pos"
verdict = "diverge"
mode = "trace"
reason = "same as room 45: the tile at x=-16 px is wrapped to 240 in the port."

